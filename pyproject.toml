[project]
name = "thichhoc-dict"
version = "0.1.0"
description = "Open-source dictionaries for e-readers — English–Vietnamese and Chinese–Vietnamese (thichhoc.com)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "thichhoc.com" }]

dependencies = [
    "jinja2>=3.1",
    "lemminflect>=0.2.3",
    "wordfreq>=3.1",
    "spylls>=0.1.7",
    "anthropic>=0.120.2",
    "openai>=2.53.0",
]

[project.scripts]
thichhoc-dict = "core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.uv]
package = true
