name: validate → build → release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: dict-en-vi

jobs:
  build:
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only, so the publish step below fails
    # with "Resource not accessible by integration" — and it fails at the very
    # end, after validate, the inflection gate and three builds have all
    # passed, which reads like a data problem and is not one. Declared here
    # rather than flipped in repo settings so a fork gets a working release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # Schema first: an invalid entry becomes a broken lookup on somebody's
      # Kindle, so nothing downstream runs until the data is clean (plan §7.1).
      - name: Validate entry store
        run: uv run thichhoc-dict validate $PROJECT/data/entries

      # The upstream corpora are only needed to regenerate entries; the
      # committed JSONL is what we build from. The test suite needs nothing
      # else either — it runs against the store, not against LemmInflect.
      - name: Inflection release gate
        run: cd $PROJECT/tests && uv run python test_inflection.py

      - name: Coverage report
        run: uv run python qa/report_stats.py $PROJECT/data/entries | tee coverage.txt

      - name: Build dictionaries
        run: |
          uv run thichhoc-dict build "$PROJECT/data/entries" \
            --out build \
            --date "$(date -u +%Y-%m-%d)" \
            ${GITHUB_REF_TYPE:+${GITHUB_REF_NAME:+--version "${GITHUB_REF_NAME#v}"}}

      # kindlegen cannot be installed in CI (Amazon ships it only inside Kindle
      # Previewer, which has no headless installer and no redistribution
      # rights). CI publishes the MOBI source; the .mobi is built on a
      # maintainer machine and attached to the release.
      # ATTRIBUTION.txt is generated by the build (core/attribution.py) and goes
      # into every bundle: CC BY-SA obliges a downstream reuser to retain the
      # notice, and they can only retain what actually reached them.
      - name: Package MOBI source
        run: cd build/en-vi && tar czf ../../mobi-src-en-vi.tar.gz mobi-src ATTRIBUTION.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dictionaries
          path: |
            build/en-vi/thichhoc-en-vi.ifo
            build/en-vi/thichhoc-en-vi.idx
            build/en-vi/thichhoc-en-vi.syn
            build/en-vi/thichhoc-en-vi.dict.dz
            build/en-vi/dicthtml-en-vi.zip
            build/en-vi/ATTRIBUTION.txt
            mobi-src-en-vi.tar.gz
            coverage.txt

      - name: Bundle StarDict
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd build/en-vi
          zip -j ../../stardict-en-vi.zip \
            thichhoc-en-vi.ifo thichhoc-en-vi.idx \
            thichhoc-en-vi.syn thichhoc-en-vi.dict.dz ATTRIBUTION.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # v1.0 ships labelled beta on purpose (plan §10): a dictionary that
          # is wrong damages the brand more than one that is late.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v1.') }}
          body_path: coverage.txt
          # dicthtml-en-vi.zip ships bare on purpose: it is copied straight onto
          # the device, so wrapping it in a second archive to carry a text file
          # would cost every Kobo user an extra unzip. That target's attribution
          # rides inside the dictionary instead — look up "thichhoc" — with
          # ATTRIBUTION.txt attached here as its own asset.
          files: |
            stardict-en-vi.zip
            build/en-vi/dicthtml-en-vi.zip
            build/en-vi/ATTRIBUTION.txt
            mobi-src-en-vi.tar.gz
